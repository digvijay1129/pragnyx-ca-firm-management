name: Application checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: client
        run: npm install
      - name: Build frontend
        working-directory: client
        run: npm run build

  backend-syntax:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: server
        run: npm install
      - name: Check JavaScript syntax
        working-directory: server
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find src test -type f -name '*.js' -print)

  backend-integration:
    name: Backend API integration tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 }).ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/pragnyx_test
      JWT_SECRET: ci-only-integration-secret-with-enough-randomness
      JWT_EXPIRES_IN: 1h
      CLIENT_URL: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: server
        run: npm install
      - name: Run API integration tests
        working-directory: server
        run: npm test
