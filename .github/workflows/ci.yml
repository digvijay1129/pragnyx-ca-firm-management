name: Application checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: client
        run: npm install
      - name: Build frontend
        working-directory: client
        run: npm run build

  backend-syntax:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: server
        run: npm install
      - name: Check JavaScript syntax
        working-directory: server
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find src test -type f -name '*.js' -print)

  backend-integration:
    name: Backend API integration tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 }).ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/pragnyx_test
      JWT_SECRET: ci-only-integration-secret-with-enough-randomness
      JWT_EXPIRES_IN: 1h
      CLIENT_URL: http://127.0.0.1:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: server
        run: npm install
      - name: Run API integration tests
        working-directory: server
        run: npm test
      - name: Seed isolated Postman test accounts and services
        working-directory: server
        env:
          ADMIN_NAME: PragnyX CI Admin
          ADMIN_EMAIL: pragnyx-ci-admin@example.test
          ADMIN_PASSWORD: PragnyX-CI-Admin-2026!
        run: npm run seed
      - name: Start API for Postman collection
        working-directory: server
        run: |
          npm start > "$RUNNER_TEMP/pragnyx-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pragnyx-api.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              echo "API health check passed."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/pragnyx-api.log"
          echo "API did not become healthy."
          exit 1
      - name: Run Postman collection with Newman
        working-directory: server
        env:
          POSTMAN_CLIENT_EMAIL: pragnyx-ci-client-${{ github.run_id }}@example.test
        run: |
          npx --yes newman@6 run ../postman/PragnyX_CA_Firm_Management.postman_collection.json \
            --reporters cli,junit \
            --reporter-junit-export newman-report.xml \
            --env-var "apiHost=127.0.0.1" \
            --env-var "apiPort=5000" \
            --env-var "clientName=PragnyX CI Client" \
            --env-var "clientEmail=$POSTMAN_CLIENT_EMAIL" \
            --env-var "clientPhone=+91 98765 43210" \
            --env-var "clientPassword=PragnyX-CI-Client-2026!" \
            --env-var "adminEmail=pragnyx-ci-admin@example.test" \
            --env-var "adminPassword=PragnyX-CI-Admin-2026!" \
            --env-var "selectedService=Income Tax Filing" \
            --env-var "preferredDate=$(date -u -d '+2 days' +%F)"
      - name: Install frontend dependencies for browser tests
        working-directory: client
        run: npm install
      - name: Install Chromium and browser dependencies
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        working-directory: client
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          E2E_CLIENT_PASSWORD: PragnyX-CI-Browser-Client-2026!
          E2E_ADMIN_EMAIL: pragnyx-ci-admin@example.test
          E2E_ADMIN_PASSWORD: PragnyX-CI-Admin-2026!
        run: npm run test:e2e
      - name: Upload browser screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pragnyx-browser-e2e-report
          path: |
            client/test-results/
            client/playwright-report/
          if-no-files-found: warn
      - name: Upload Postman execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pragnyx-postman-report
          path: server/newman-report.xml
          if-no-files-found: warn
